    <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chinese Credit Program</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Tahoma", sans-serif;

    background:
    linear-gradient(
        135deg,
        #f5e1c3,
        #e8b9a2,
        #b96d5c
    );

    position:relative;
}


/* زخارف الخلفية */

.pattern{
    position:absolute;
    inset:0;
    opacity:.15;
    background:
    radial-gradient(circle at 20% 30%, #8b3a2e 3px, transparent 4px),
    radial-gradient(circle at 80% 70%, #8b3a2e 3px, transparent 4px);
}


/* سور الصين */

.wall{
    position:absolute;
    bottom:20px;
    right:-50px;
    width:75%;
    height:160px;
    border-top:35px solid #8b6248;
    border-radius:60% 40% 0 0;
    transform:rotate(-8deg);
    opacity:.25;
}


/* القصر الصيني */

.palace{
    position:absolute;
    left:35px;
    top:80px;
    width:150px;
    height:100px;
}


/* سقف القصر */

.palace:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:150px;
    height:35px;
    background:#a94b3c;
    clip-path:polygon(0 100%,50% 0,100% 100%);
}


/* جسم القصر */

.palace:after{
    content:"";
    position:absolute;
    top:35px;
    left:25px;
    width:100px;
    height:70px;
    background:#f2d39b;
    border:5px solid #8b3a2e;
}


/* جامعة القاهرة */

.cairo{
    position:absolute;
    right:35px;
    top:180px;
    width:150px;
    height:100px;
    background:#e7c99b;
    border:5px solid #8b6248;
}


/* أعمدة الجامعة */

.cairo:before{
    content:"";
    position:absolute;
    top:-35px;
    left:0;
    width:100%;
    height:35px;
    background:#8b6248;
    clip-path:polygon(0 100%,50% 0,100% 100%);
}
 
/* الباندا */

.panda{
    position:absolute;
    top:20px;
    right:160px;
    font-size:85px;
}


/* الكتابة الصينية */

.chinese{
    position:absolute;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    font-size:100px;
    color:rgba(120,40,30,.25);
    font-family:serif;
}


/* العنوان */

.content{
    position:relative;
    z-index:5;
    text-align:center;
    padding-top:330px;
}


h1{
    color:#7b3025;
    font-size:42px;
    margin-bottom:15px;
}


p{
    color:#5b4035;
    font-size:22px;
}


/* للموبايل */

@media(max-width:600px){

    .palace{
        transform:scale(.7);
        left:-10px;
    }

    .cairo{
        transform:scale(.7);
        right:-10px;
    }

    .panda{
        right:30px;
        font-size:60px;
    }

    .chinese{
        font-size:65px;
    }

    h1{
        font-size:30px;
    }

}

</style>

</head>


<body>

<div class="pattern"></div>

<div class="wall"></div>

<div class="palace"></div>

<div class="cairo"></div>

<div class="panda">
🐼
</div>

<div class="chinese">
中文
</div>


<div class="content">

<h1>
Chinese Credit Program
</h1>

<p>
Cairo University
</p>

</div>


</body>

</html>
