<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chinese Program - Cairo University</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Tahoma", sans-serif;

    background:
    linear-gradient(
        135deg,
        #f4dfc1,
        #e8b7a1,
        #b86b5b
    );

    position:relative;
}


/* زخرفة صينية في الخلفية */

.wall{
    position:absolute;
    bottom:-40px;
    right:-50px;
    width:80%;
    height:170px;
    border-top:25px solid rgba(120,70,40,0.25);
    border-radius:50%;
    transform:rotate(-8deg);
}


/* القصر الصيني */

.palace{
    position:absolute;
    left:25px;
    top:80px;
    font-size:120px;
}


/* جامعة القاهرة */

.cairo{
    position:absolute;
    right:40px;
    top:180px;
    font-size:120px;
}


/* الكتابة الصينية */

.chinese{
    position:absolute;
    top:120px;
    left:50%;
    transform:translateX(-50%);
    font-size:100px;
    color:rgba(120,40,30,0.25);
}


/* الباندا */

.panda{
    position:absolute;
    top:0;
    right:120px;
    font-size:90px;
}


/* المحتوى لاحقا */

.content{
    position:relative;
    z-index:2;
    text-align:center;
    padding-top:350px;
}


h1{
    color:#7a3025;
    font-size:42px;
}

</style>

</head>
<body>

<div class="wall"></div>

<div class="palace">
🏯
</div>

<div class="cairo">
🏛️
</div>

<div class="chinese">
中文
</div>

<div class="panda">
🐼
</div>


<div class="content">

<h1>
برنامج اللغة الصينية
</h1>

<p>
جامعة القاهرة
</p>

</div>


</body>

</html>
